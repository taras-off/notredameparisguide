<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e57e0"/>
    </marker>
  </defs>
  <rect width="1040" height="470" fill="#ffffff"/>
  <!-- plan: west towers + facade -->
  <g fill="#eef1f8" stroke="#141f42" stroke-width="3" stroke-linejoin="round">
    <rect x="44" y="92" width="74" height="86"/>
    <rect x="44" y="292" width="74" height="86"/>
    <rect x="44" y="178" width="74" height="114"/>
    <!-- nave + aisles + side chapels -->
    <rect x="118" y="92" width="452" height="286"/>
    <!-- transept arms (barely projecting) -->
    <rect x="570" y="76" width="62" height="318"/>
    <!-- choir body -->
    <path d="M632,92 L800,92 A143,143 0 0 1 800,378 L632,378 Z"/>
  </g>
  <!-- radiating chapels scallop -->
  <g fill="#eef1f8" stroke="#141f42" stroke-width="2.5">
    <circle cx="883" cy="120" r="16"/><circle cx="930" cy="168" r="16"/><circle cx="948" cy="235" r="18"/>
    <circle cx="930" cy="302" r="16"/><circle cx="883" cy="350" r="16"/>
  </g>
  <!-- internal divisions: aisles -->
  <g stroke="#9aa7c7" stroke-width="2" fill="none" stroke-dasharray="2 5">
    <line x1="118" y1="160" x2="570" y2="160"/>
    <line x1="118" y1="310" x2="570" y2="310"/>
    <line x1="632" y1="160" x2="800" y2="160"/>
    <line x1="632" y1="310" x2="800" y2="310"/>
  </g>
  <!-- choir enclosure (screen) -->
  <path d="M650,170 L790,170 A65,65 0 0 1 790,300 L650,300 Z" fill="#f6f0e2" stroke="#c6a05a" stroke-width="3"/>
  <!-- crossing -->
  <rect x="580" y="178" width="42" height="114" fill="none" stroke="#9aa7c7" stroke-width="2"/>
  <!-- visitor route -->
  <path d="M10,235 L135,235 L135,128 L612,128 L800,128 A107,107 0 0 1 800,342 L612,342 L135,342 L135,355 L10,355"
        fill="none" stroke="#1e57e0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 0"/>
  <g fill="none" stroke="#1e57e0" stroke-width="5" marker-end="url(#ar)">
    <path d="M10,235 L60,235"/>
    <path d="M300,128 L360,128"/>
    <path d="M680,128 L740,128"/>
    <path d="M740,342 L680,342"/>
    <path d="M360,342 L300,342"/>
    <path d="M60,355 L14,355"/>
  </g>
  <!-- compass -->
  <g transform="translate(1000,52)">
    <circle r="22" fill="#fff" stroke="#141f42" stroke-width="2"/>
    <path d="M0,-16 L7,6 L0,1 L-7,6 Z" fill="#141f42"/>
    <text y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#141f42">N</text>
  </g>
  <!-- numbered stops -->
  <g font-size="17" font-weight="800" text-anchor="middle">
    <g><circle cx="175" cy="235" r="17" fill="#c6a05a" stroke="#fff" stroke-width="3"/><text x="175" y="241" fill="#141f42">1</text></g>
    <g><circle cx="360" cy="100" r="17" fill="#c6a05a" stroke="#fff" stroke-width="3"/><text x="360" y="106" fill="#141f42">2</text></g>
    <g><circle cx="601" cy="104" r="17" fill="#c6a05a" stroke="#fff" stroke-width="3"/><text x="601" y="110" fill="#141f42">3</text></g>
    <g><circle cx="601" cy="235" r="17" fill="#c6a05a" stroke="#fff" stroke-width="3"/><text x="601" y="241" fill="#141f42">4</text></g>
    <g><circle cx="720" cy="150" r="17" fill="#c6a05a" stroke="#fff" stroke-width="3"/><text x="720" y="156" fill="#141f42">5</text></g>
    <g><circle cx="948" cy="235" r="17" fill="#c6a05a" stroke="#fff" stroke-width="3"/><text x="948" y="241" fill="#141f42">6</text></g>
    <g><circle cx="883" cy="350" r="17" fill="#c6a05a" stroke="#fff" stroke-width="3"/><text x="883" y="356" fill="#141f42">7</text></g>
    <g><circle cx="740" cy="300" r="17" fill="#c6a05a" stroke="#fff" stroke-width="3"/><text x="740" y="306" fill="#141f42">8</text></g>
    <g><circle cx="642" cy="292" r="17" fill="#c6a05a" stroke="#fff" stroke-width="3"/><text x="642" y="298" fill="#141f42">9</text></g>
    <g><circle cx="601" cy="368" r="17" fill="#c6a05a" stroke="#fff" stroke-width="3"/><text x="601" y="374" fill="#141f42">10</text></g>
    <g><circle cx="360" cy="370" r="17" fill="#c6a05a" stroke="#fff" stroke-width="3"/><text x="360" y="376" fill="#141f42">11</text></g>
    <g><circle cx="180" cy="370" r="17" fill="#c6a05a" stroke="#fff" stroke-width="3"/><text x="180" y="376" fill="#141f42">12</text></g>
  </g>
  <!-- organ marker (west, above central doors) -->
  <g><rect x="62" y="190" width="38" height="26" rx="5" fill="#141f42"/><path d="M70,212 v-14 M76,212 v-17 M82,212 v-20 M88,212 v-17 M94,212 v-14" stroke="#fff" stroke-width="3"/></g>
</svg>
